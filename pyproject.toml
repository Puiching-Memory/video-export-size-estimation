[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-export-size-estimation"
version = "0.1.0"
description = "Budgeted video export estimation and verified size control"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
vsize = "vsize.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
